[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# Pinned for a reproducible, PulseChain-safe deploy bytecode (v4.9 deploy kit).
# v5.5.0: via_ir enabled — executeAndPay() takes the live builder-payment context (router +
# per-block fields) as extra calldata, which overflows the legacy stack; the IR pipeline
# compiles it cleanly. This is a fresh deploy, so the bytecode is re-pinned under these settings.
solc_version = "0.8.24"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
via_ir = true
